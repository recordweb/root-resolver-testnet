name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/fabric-root-resolver

            # Repo-Stand holen
            git pull origin main

            # Kryptomaterial und Channel-Artefakte erzeugen falls nicht vorhanden
            if [ ! -d "network/crypto-config" ] || [ -z "$(ls -A network/crypto-config)" ]; then
              echo "==> Generiere Kryptomaterial..."
              bash scripts/1_generate_crypto.sh
              bash scripts/2_generate_channel_artifacts.sh
            fi

            # Netzwerk starten / aktualisieren
            cd network
            docker compose up -d --build

            echo "==> Deployment abgeschlossen"