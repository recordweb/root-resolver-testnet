name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/fabric-root-resolver

            git fetch origin

            # Root-eigene Dateien aus früheren Docker-Läufen entfernen (BEVOR git clean)
            docker run --rm -v /opt/fabric-root-resolver:/workspace alpine:3.20 \
              sh -c "rm -rf /workspace/chaincode/namespace-registry/vendor /workspace/namespace-registry.tar.gz"

            git reset --hard origin/main
            git clean -fd

            chmod +x scripts/*.sh
            bash scripts/0_full_reset.sh --test