name: Deploy Chaincode to VPS

on:
  push:
    branches: [main]
    paths:
      - 'chaincode/**'
      - 'scripts/7_deploy_chaincode.sh'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy chaincode via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/fabric-root-resolver
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            chmod +x scripts/7_deploy_chaincode.sh
            bash scripts/7_deploy_chaincode.sh